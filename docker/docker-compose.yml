services:
  
  db:
    image: mysql:8.4
    container_name: eurodisney_db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: supersaiyan
      MYSQL_DATABASE: eurodisney
      MYSQL_USER: root
      MYSQL_PASSWORD: supersaiyan

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-u",
        "root",
        "-p",
        "supersaiyan"
      ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile

    container_name: eurodisney-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: mysql+pymysql://root:supersaiyan@db:3306/eurodisney
      SECRET_KEY: superkey

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ../backend:/app
  
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile

    container_name: eurodisney-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000
    
    depends_on:
      - backend

    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
