services:

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile

    container_name: eurodisney-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: "mysql+pymysql://root:supersaiyan@host.docker.internal:3306/eurodisney?charset=utf8mb4"
      SECRET_KEY: "mykey"

    volumes:
      - ../backend:/app
  
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile

    container_name: eurodisney-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000
    
    depends_on:
      - backend

    volumes:
      - ../frontend:/app
      - /app/node_modules